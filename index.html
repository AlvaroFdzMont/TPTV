<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TPTV · Te pesco TV</title>
<meta name="description" content="Viento, marea, oleaje, luna, pesqueros y peces del Campo de Gibraltar y Tarifa. Y tu diario de capturas con los colegas.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TPTV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://marine-api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
</head>
<body class="dark-tab tab-hoy">
<div id="app">
  <main class="views">
    <section class="view view-hoy on" id="v-hoy" data-view="hoy"></section>
    <section class="view" id="v-kit" data-view="kit"></section>
    <section class="view" id="v-spots" data-view="spots"></section>
    <section class="view" id="v-peces" data-view="peces"></section>
    <section class="view" id="v-diario" data-view="diario"></section>
  </main>
  <button class="fab" id="fab" aria-label="Apuntar captura"></button>
  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <button class="on" data-tab="hoy"><span data-ic="today"></span>Hoy</button>

    <button data-tab="spots"><span data-ic="pin"></span>Pesqueros</button>
    <button data-tab="peces"><span data-ic="dex"></span>Pecedex</button>
    <button data-tab="diario"><span data-ic="book"></span>Diario</button>
    <button data-tab="kit"><span data-ic="list"></span>Checklist</button>
  </nav>
</div>
<div class="backdrop" id="backdrop"></div>
<div id="sheets"></div>
<div id="toast"><div></div></div>
<noscript><p style="padding:40px;color:#fff">TPTV necesita JavaScript.</p></noscript>
<script src="js/config.js"></script>
<script src="js/spots.js"></script>
<script src="js/visual.js"></script>
<script src="js/data.js"></script>
<script src="js/photos.js"></script>
<script src="js/glyphs.js"></script>
<script src="js/badges.js"></script>
<script src="js/astro.js"></script>
<script src="js/pena.js"></script>
<script src="js/app.js"></script>
</body>
</html>
